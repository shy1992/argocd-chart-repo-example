apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
spec:
  project: default
  source:
    repoURL: https://github.com/shy1992/argocd-chart-repo-example
    targetRevision: HEAD
    path: charts/app
    helm:
      valueFiles:
        - ../../environments/dev/app-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true